name: NEXUS CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  validate:

    name: Validate NEXUS Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check HTML file
        run: |
          echo "Checking NEXUS application..."

          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          echo "index.html found successfully"

      - name: Validate HTML content
        run: |
          echo "Checking required NEXUS content..."

          grep -q "NEXUS" index.html
          grep -q "Release Intelligence" index.html

          echo "Required content found"

      - name: Run build simulation
        run: |
          echo "================================="
          echo "NEXUS RELEASE BUILD"
          echo "================================="

          echo "Source: index.html"
          echo "Environment: production"
          echo "Build status: SUCCESS"

          echo "================================="

      - name: Generate build information
        run: |
          echo "Build timestamp:"
          date

          echo ""
          echo "Commit:"
          echo "${GITHUB_SHA}"

          echo ""
          echo "Branch:"
          echo "${GITHUB_REF_NAME}"

          echo ""
          echo "Repository:"
          echo "${GITHUB_REPOSITORY}"

      - name: Pipeline completed
        run: |
          echo "================================="
          echo "NEXUS CI PIPELINE PASSED"
          echo "================================="

      - name: Send success notification to Slack
        if: success()
        run: |
          curl -X POST \
            -H "Content-type: application/json" \
            --data '{
              "text": "🚀 NEXUS CI Pipeline SUCCESS\nRepository: '${{ github.repository }}'\nBranch: '${{ github.ref_name }}'\nCommit: '${{ github.sha }}'"
            }' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"